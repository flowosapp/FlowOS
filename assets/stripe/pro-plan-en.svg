<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="100%" stop-color="#0d1020"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)" rx="28"/>

  <!-- Glow orb -->
  <circle cx="250" cy="200" r="200" fill="#6366f1" opacity="0.12" filter="url(#blur)"/>

  <!-- Border (highlight) -->
  <rect width="498" height="498" x="1" y="1" fill="none" stroke="url(#brand)" stroke-opacity="0.45" stroke-width="1.5" rx="27"/>

  <!-- "Most Popular" badge -->
  <rect x="148" y="28" width="204" height="30" rx="15" fill="url(#brand)"/>
  <text x="250" y="48" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">★ MOST POPULAR</text>

  <!-- Icon background circle -->
  <circle cx="250" cy="181" r="64" fill="url(#brand)" opacity="0.14"/>
  <circle cx="250" cy="181" r="64" fill="none" stroke="url(#brand)" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- CPU / chip icon -->
  <g transform="translate(218, 149)">
    <rect x="10" y="10" width="44" height="44" rx="6" fill="none" stroke="url(#brand)" stroke-width="2.5"/>
    <rect x="18" y="18" width="28" height="28" rx="3" fill="url(#brand)" opacity="0.5"/>
    <line x1="0" y1="22" x2="10" y2="22" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="10" y2="32" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="42" x2="10" y2="42" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="22" x2="64" y2="22" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="32" x2="64" y2="32" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="54" y1="42" x2="64" y2="42" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="0" x2="22" y2="10" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="32" y2="10" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="42" y1="0" x2="42" y2="10" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="54" x2="22" y2="64" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="54" x2="32" y2="64" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="42" y1="54" x2="42" y2="64" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Plan name -->
  <text x="250" y="290" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f2f2f5" text-anchor="middle" letter-spacing="-1">Pro</text>

  <!-- Price -->
  <text x="250" y="336" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="56" font-weight="900" fill="url(#brand)" text-anchor="middle" letter-spacing="-2">$19</text>
  <text x="250" y="362" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#62627a" text-anchor="middle">/month</text>

  <!-- Divider -->
  <line x1="100" y1="384" x2="400" y2="384" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="250" y="414" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#9898a8" text-anchor="middle">Unlimited AI · Analytics · Finance</text>

  <!-- FlowOS brand -->
  <text x="250" y="462" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6366f1" text-anchor="middle" letter-spacing="2" opacity="0.7">FLOWOS</text>
</svg>
