<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b14"/>
      <stop offset="100%" stop-color="#130b14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)" rx="28"/>

  <!-- Dual glow -->
  <circle cx="160" cy="180" r="180" fill="#8b5cf6" opacity="0.10" filter="url(#blur)"/>
  <circle cx="340" cy="280" r="160" fill="#ec4899" opacity="0.08" filter="url(#blur)"/>

  <!-- Border -->
  <rect width="498" height="498" x="1" y="1" fill="none" stroke="url(#brand)" stroke-opacity="0.35" stroke-width="1.5" rx="27"/>

  <!-- Icon background -->
  <circle cx="250" cy="175" r="64" fill="url(#brand)" opacity="0.13"/>
  <circle cx="250" cy="175" r="64" fill="none" stroke="url(#brand)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Crown icon -->
  <g transform="translate(214, 145)">
    <rect x="0" y="42" width="72" height="14" rx="4" fill="url(#brand)" opacity="0.9"/>
    <polygon points="0,40 12,10 24,28 36,0 48,28 60,10 72,40" fill="url(#brand)" stroke="none"/>
    <circle cx="36" cy="7" r="5" fill="#fff" opacity="0.9"/>
    <circle cx="12" cy="17" r="3.5" fill="#f0abfc" opacity="0.8"/>
    <circle cx="60" cy="17" r="3.5" fill="#f0abfc" opacity="0.8"/>
  </g>

  <!-- Plan name -->
  <text x="250" y="286" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f2f2f5" text-anchor="middle" letter-spacing="-1">Flow+</text>

  <!-- Price -->
  <text x="250" y="332" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="56" font-weight="900" fill="url(#brand)" text-anchor="middle" letter-spacing="-2">$49</text>
  <text x="250" y="358" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#62627a" text-anchor="middle">/month</text>

  <!-- Divider -->
  <line x1="100" y1="380" x2="400" y2="380" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="250" y="410" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#9898a8" text-anchor="middle">All Unlimited · VIP Support</text>

  <!-- FlowOS brand -->
  <text x="250" y="460" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#8b5cf6" text-anchor="middle" letter-spacing="2" opacity="0.7">FLOWOS</text>
</svg>
