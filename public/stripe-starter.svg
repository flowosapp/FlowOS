<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>
  <rect width="500" height="500" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>

  <!-- Glow circle -->
  <circle cx="250" cy="185" r="90" fill="#71717a" opacity="0.06"/>

  <!-- Icon background -->
  <rect x="198" y="133" width="104" height="104" rx="28" fill="#1c1c1c" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Lightning bolt (Zap icon) -->
  <polyline points="262,152 242,185 258,185 238,218" fill="none" stroke="url(#icon-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Label -->
  <text x="250" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#71717a" text-anchor="middle" letter-spacing="4">PLANO</text>

  <!-- Plan name -->
  <text x="250" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="48" font-weight="700" fill="url(#text-grad)" text-anchor="middle" letter-spacing="-1">Starter</text>

  <!-- Tagline -->
  <text x="250" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" fill="#52525b" text-anchor="middle">Comece a organizar sua vida</text>

  <!-- Bottom badge -->
  <rect x="143" y="403" width="214" height="34" rx="17" fill="#1c1c1c" stroke="#3f3f46" stroke-width="1"/>
  <text x="250" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="1">15 DIAS GRÁTIS</text>
  <text x="250" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="400" fill="#52525b" text-anchor="middle">depois R$ 29,90 / mês</text>
</svg>
