<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1628"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>
  <rect width="500" height="500" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>

  <!-- Outer glow ring -->
  <circle cx="250" cy="185" r="92" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
  <circle cx="250" cy="185" r="78" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.15"/>

  <!-- Icon background -->
  <rect x="197" y="133" width="106" height="106" rx="28" fill="#0f1e3d" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Crown icon -->
  <g filter="url(#glow-filter)" stroke="url(#icon-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Crown shape -->
    <path d="M226 200 L226 175 L250 190 L274 162 L298 175 L298 200 Z" fill="rgba(59,130,246,0.12)" stroke="url(#icon-grad)" stroke-width="5"/>
    <!-- Crown base -->
    <line x1="221" y1="200" x2="279" y2="200" stroke="url(#icon-grad)" stroke-width="6"/>
    <!-- Crown dots -->
    <circle cx="274" cy="162" r="4" fill="#00d4ff" stroke="none"/>
    <circle cx="250" cy="190" r="3" fill="#60a5fa" stroke="none"/>
    <circle cx="226" cy="175" r="4" fill="#60a5fa" stroke="none"/>
  </g>

  <!-- Label -->
  <text x="250" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#3b82f6" text-anchor="middle" letter-spacing="4">PLANO</text>

  <!-- Plan name -->
  <text x="250" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="64" font-weight="700" fill="url(#text-grad)" text-anchor="middle" letter-spacing="-2">Pro</text>

  <!-- Tagline -->
  <text x="250" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" fill="#60a5fa" text-anchor="middle" opacity="0.7">IA + finanças completas + sem limites</text>

  <!-- Bottom badge -->
  <rect x="167" y="410" width="166" height="32" rx="16" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="250" y="431" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Mais popular · R$ 49,90 / mês</text>
</svg>
